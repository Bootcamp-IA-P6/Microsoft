id: navi-chat-v2
name: navi-chat-v2
version: 2.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
  functions:
    enabled: true
    allowAnonymous: true